<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة الامتحانات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <header class="shell topbar glass">
    <div>
      <h1>منصة الامتحانات</h1>
      <p id="studentWelcome" class="muted">جارٍ التحقق من الحساب...</p>
    </div>
    <div class="topbar-actions">
      <a href="./index.html" class="btn btn-ghost">العودة للبوابة</a>
      <button id="studentLogoutBtn" class="btn btn-ghost">خروج الطالب</button>
      <button id="themeToggle" class="btn btn-ghost" aria-label="تبديل المظهر">تبديل المظهر</button>
    </div>
  </header>

  <main class="shell page-gap">
    <section class="glass hero">
      <p class="eyebrow">محتوى محمي بالحساب</p>
      <h2>الاختبارات المتاحة لك</h2>
      <p class="muted">لا تظهر هنا إلا الاختبارات المفعّلة، ويتم منع إعادة تسليم نفس الاختبار أكثر من مرة.</p>
    </section>

    <section class="glass controls">
      <div class="field">
        <label for="searchInput">البحث</label>
        <input id="searchInput" type="search" placeholder="ابحث بالعنوان أو المادة أو الوصف" />
      </div>
      <div class="field">
        <label for="subjectFilter">المادة</label>
        <select id="subjectFilter">
          <option value="all">كل المواد</option>
        </select>
      </div>
    </section>

    <section id="loadingState" class="state glass">جارٍ تحميل الاختبارات...</section>
    <section id="errorState" class="state glass hidden"></section>
    <section id="emptyState" class="state glass hidden">لا توجد اختبارات متاحة الآن.</section>
    <section id="cardsGrid" class="cards-grid hidden"></section>
  </main>

  <template id="examCardTemplate">
    <article class="exam-card glass">
      <div class="exam-card-head">
        <span class="badge" data-role="subject"></span>
        <span class="date" data-role="date"></span>
      </div>
      <h3 data-role="title"></h3>
      <p class="desc" data-role="description"></p>
      <div class="meta-row">
        <span data-role="duration"></span>
        <span class="pill" data-role="questionCount"></span>
      </div>
      <div class="row-actions card-actions">
        <a class="btn btn-primary" data-role="startExam">دخول الاختبار</a>
        <a class="btn btn-ghost hidden" data-role="download" target="_blank" rel="noopener">تنزيل</a>
      </div>
    </article>
  </template>

  <script type="module" src="./exams.js?v=20260321a"></script>
</body>
</html>
