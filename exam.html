<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاختبار الإلكتروني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <header class="shell topbar glass">
    <div>
      <h1 id="examTitle">الاختبار الإلكتروني</h1>
      <p id="examSubtitle" class="muted">جارٍ تحميل تفاصيل الاختبار...</p>
    </div>
    <div class="row-actions">
      <a id="backToExamsLink" href="./index.html" class="btn btn-ghost">العودة إلى الاختبارات</a>
      <button id="themeToggle" class="btn btn-ghost" aria-label="تبديل المظهر">تبديل المظهر</button>
    </div>
  </header>

  <main class="shell page-gap">
    <section id="examLoading" class="state glass">جارٍ تحميل الاختبار...</section>
    <section id="examError" class="state glass hidden"></section>

    <section id="examPanel" class="glass panel hidden">
      <section class="exam-status-grid">
        <article class="status-card status-card-accent">
          <p class="status-label">الوقت المتبقي</p>
          <h2 id="timerDisplay">--:--</h2>
          <p id="timerHint" class="muted">سيظهر المؤقت بعد تحميل مدة الاختبار.</p>
        </article>
        <article class="status-card">
          <p class="status-label">تقدّمك</p>
          <div class="progress-track" aria-hidden="true">
            <div id="timerProgress" class="progress-bar"></div>
          </div>
          <p id="progressText" class="muted">أجب عن جميع الأسئلة ثم أرسل الحل.</p>
        </article>
      </section>

      <form id="candidateForm" class="stack compact-form">
        <div class="grid-2">
          <div class="field">
            <label for="candidateName">الاسم الكامل</label>
            <input id="candidateName" name="candidateName" type="text" required />
          </div>
          <div class="field">
            <label for="candidatePhone">رقم الهاتف</label>
            <input id="candidatePhone" name="candidatePhone" type="tel" inputmode="numeric" maxlength="11" pattern="01[0125][0-9]{8}" placeholder="01xxxxxxxxx" required />
          </div>
        </div>
      </form>

      <form id="examForm" class="stack">
        <div id="questionList" class="question-list"></div>
        <div class="row-actions">
          <button id="submitBtn" class="btn btn-primary" type="submit">إرسال الإجابات</button>
        </div>
      </form>
    </section>

    <section id="resultBox" class="glass panel hidden"></section>
    <section id="reviewBox" class="glass panel hidden"></section>
  </main>

  <script type="module" src="./exam.js?v=20260322b"></script>
</body>
</html>
